name: pr_check_webapp_dotnet_windows

on:
  push:
    branches:
      - master
      - releases/*
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
      - 'releases/*'

permissions:
  contents: read

# CONFIGURATION
# For help, go to https://github.com/Azure/Actions
#
# 1. Set up the following secrets in your repository:
#   AZURE_WEBAPP_PUBLISH_PROFILE
#
# 2. Change these variables for your configuration:
env:
  AZURE_WEBAPP_NAME: dotnetwebappdeploy    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NUGET_VERSION: '5.3.1'                # set this to the node version to use

jobs:
  run-integration-test:
    environment: automation test
    name: Validate PR
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Azure-Samples/dotnet-sample
        ref: master
        path: 'dotnetsample'

    - name: Install Nuget
      uses: nuget/setup-nuget@296fd3ccf8528660c91106efefe2364482f86d6f # v1.2.0
      with:
        nuget-version: ${{ env.NUGET_VERSION}}
    - name: NuGet to restore dependencies as well as project-specific tools that are specified in the project file
      run: |
          pwd
          cd dotnetsample
          nuget restore
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@c26a08ba26249b81327e26f6ef381897b6a8754d # v1.0.2
    
    - name: Run MSBuild
      run: msbuild .\dotnetsample\SampleWebApplication.sln
    
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      name: Checkout from PR branch
      with: 
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        path: 'webapps-deploy'
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Installing dependencies and building latest changes
      run: |
        cd webapps-deploy
        npm ci
        npm run package
    
    - name: 'Deploy to Azure WebApp'
      uses: ./webapps-deploy/
      with: 
        app-name: ${{ env.AZURE_WEBAPP_NAME }} # Replace with your app name
        publish-profile: ${{ secrets.DOTNETWEBAPPSDEPLOY_PUBLISH_PROFILE }}
        package: 'D:\a\webapps-deploy\webapps-deploy\dotnetsample\SampleWebApplication\'
